name: foco-hotel-api

services:
  app:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: foco-hotel-api:0.1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: foco_hotel
      DB_USERNAME: foco
      DB_PASSWORD: foco
      IMPORT_HOTELS_PATH: /var/www/imports/hotels.xml
      IMPORT_ROOMS_PATH: /var/www/imports/rooms.xml
      IMPORT_RESERVATIONS_PATH: /var/www/imports/reserves.xml
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/html
      - app_vendor:/var/www/html/vendor
      - ./hotels.xml:/var/www/imports/hotels.xml:ro
      - ./rooms.xml:/var/www/imports/rooms.xml:ro
      - ./reserves.xml:/var/www/imports/reserves.xml:ro

  cron:
    image: foco-hotel-api:0.1.0
    entrypoint: ["/usr/local/bin/cron-entrypoint"]
    command: ["cron", "-f"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: foco_hotel
      DB_USERNAME: foco
      DB_PASSWORD: foco
      IMPORT_HOTELS_PATH: /var/www/imports/hotels.xml
      IMPORT_ROOMS_PATH: /var/www/imports/rooms.xml
      IMPORT_RESERVATIONS_PATH: /var/www/imports/reserves.xml
      IMPORT_CRON_SCHEDULE: "${IMPORT_CRON_SCHEDULE:-*/5 * * * *}"
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
      - app_vendor:/var/www/html/vendor
      - ./hotels.xml:/var/www/imports/hotels.xml:ro
      - ./rooms.xml:/var/www/imports/rooms.xml:ro
      - ./reserves.xml:/var/www/imports/reserves.xml:ro

  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: foco_hotel
      MYSQL_USER: foco
      MYSQL_PASSWORD: foco
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/mysql

volumes:
  app_vendor:
  db_data:
